name: CI Syntax & Manifest Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate JavaScript Syntax
      run: |
        node --check background.js
        node --check content.js
        node --check popup.js

    - name: Validate Manifest JSON
      run: |
        node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (manifest.manifest_version !== 3) throw new Error('Must be Manifest V3');
          if (!manifest.name || !manifest.version) throw new Error('Missing name or version');
          console.log('✅ Manifest V3 validated successfully for ' + manifest.name + ' v' + manifest.version);
        "
